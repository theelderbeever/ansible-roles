---
# Groups describe what a machine *does* (core / edge) and what it *has*
# (gpu, ...). A host can be in any number of groups; each play in site.yml
# targets one group. Per-machine values go in host_vars/<hostname>.yml.
all:
  children:
    # --- what the machine does: every host is in exactly one of these -------
    # Runs the main stack: firewall, docker, tailscale, prometheus (+ its own
    # node_exporter), unpoller, grafana, pihole, traefik.
    core:
      hosts:
        beeverdam-n0:

    # Satellite devices: node_exporter only, scraped by core's Prometheus.
    edge:
      hosts:
        beeverdam-pc:

    # --- what the machine has: add hosts only where it applies -------------
    # NVIDIA GPU (driver/nvidia-smi must already be installed) -> GPU exporter.
    gpu:
      hosts:
        beeverdam-pc:
