---
# Configuration of the core stack. Values carried over from the manually
# configured host (see references/). Machine-specific values for the core
# box (NIC name, users) live in host_vars/beeverdam-n0.yml.

# --- tailscale ---------------------------------------------------------------
tailscale_authkey: "{{ vault_tailscale_authkey | default('') }}"
tailscale_up_args:
  - --ssh
  # Core runs Pi-hole, so don't let MagicDNS take over its resolver.
  - --accept-dns=false

# --- prometheus --------------------------------------------------------------
prometheus_web_external_url: "https://prometheus.{{ base_domain }}/"
# Targets are derived from the inventory: core's own node_exporter, every
# edge host's node_exporter, every gpu host's GPU exporter. Putting a host in
# a group is all it takes to have it scraped.
prometheus_node_targets: >-
  {{ ['localhost:9100']
     + (groups['edge'] | default([])
        | map('extract', hostvars, 'scrape_address')
        | map('regex_replace', '$', ':9100') | list) }}
prometheus_scrape_configs:
  - job_name: gpu
    static_configs:
      - targets: >-
          {{ groups['gpu'] | default([])
             | map('extract', hostvars, 'scrape_address')
             | map('regex_replace', '$', ':9835') | list }}
  - job_name: unpoller
    scrape_interval: 30s
    static_configs:
      - targets:
          - localhost:9130

# --- unpoller ----------------------------------------------------------------
# Create a read-only "Limited Admin" in UniFi Network (or a local API key on
# UniFi OS) for this. No :8443 on the URL for UniFi OS consoles.
unpoller_controllers:
  - url: https://192.168.1.1  # TODO: your UniFi console/controller
    api_key: "{{ vault_unpoller_api_key }}"
    # Or instead of api_key:
    # user: unifipoller
    # pass: "{{ vault_unpoller_pass }}"

# --- grafana -----------------------------------------------------------------
grafana_domain: "grafana.{{ base_domain }}"
grafana_root_url: "https://grafana.{{ base_domain }}/"
grafana_admin_password: "{{ vault_grafana_admin_password | default('') }}"

# --- pihole ------------------------------------------------------------------
pihole_web_domain: "pihole.{{ base_domain }}"
pihole_web_password: "{{ vault_pihole_web_password | default('') }}"
pihole_adlists:
  - address: https://big.oisd.nl
    comment: OISD
  - address: https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    enabled: false
pihole_domainlist: []

# --- traefik -----------------------------------------------------------------
traefik_domain: "{{ base_domain }}"
# traefik_acme_email: required; set it in host_vars/<core host>.yml.
traefik_dns_provider: cloudflare
traefik_env:
  CF_DNS_API_TOKEN: "{{ vault_cloudflare_dns_api_token }}"
