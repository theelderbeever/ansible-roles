---
- name: Look up the latest Traefik release
  ansible.builtin.uri:
    url: https://api.github.com/repos/traefik/traefik/releases/latest
    headers:
      Accept: application/vnd.github+json
    return_content: true
  register: _traefik_latest
  when: traefik_version == 'latest'
  check_mode: false

- name: Resolve Traefik version
  ansible.builtin.set_fact:
    _traefik_version: "{{ (_traefik_latest.json.tag_name if traefik_version == 'latest' else traefik_version) | regex_replace('^v', '') }}"

- name: Set Traefik release facts
  ansible.builtin.set_fact:
    _traefik_release_dir: "{{ traefik_install_dir }}/v{{ _traefik_version }}"
    _traefik_tarball: "traefik_v{{ _traefik_version }}_linux_{{ traefik_arch }}.tar.gz"
    _traefik_base_url: "https://github.com/traefik/traefik/releases/download/v{{ _traefik_version }}"

- name: Create release directory
  ansible.builtin.file:
    path: "{{ _traefik_release_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Traefik
  ansible.builtin.get_url:
    url: "{{ _traefik_base_url }}/{{ _traefik_tarball }}"
    dest: "{{ _traefik_release_dir }}/{{ _traefik_tarball }}"
    checksum: "sha256:{{ _traefik_base_url }}/traefik_v{{ _traefik_version }}_checksums.txt"
    owner: root
    group: root
    mode: "0644"

- name: Extract Traefik
  ansible.builtin.unarchive:
    src: "{{ _traefik_release_dir }}/{{ _traefik_tarball }}"
    dest: "{{ _traefik_release_dir }}"
    remote_src: true
    include: [traefik]
    creates: "{{ _traefik_release_dir }}/traefik"
    owner: root
    group: root

- name: Link the active Traefik binary
  ansible.builtin.file:
    src: "{{ _traefik_release_dir }}/traefik"
    dest: "{{ traefik_binary }}"
    state: link
    force: true
  notify: Restart traefik
