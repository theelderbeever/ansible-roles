---
- name: Free port 53 from systemd-resolved
  ansible.builtin.import_tasks: resolved.yml
  when: pihole_disable_resolved_stub

- name: Install Pi-hole
  ansible.builtin.import_tasks: install.yml

- name: Configure pihole-FTL
  ansible.builtin.import_tasks: config.yml

- name: Manage gravity lists
  ansible.builtin.import_tasks: gravity.yml

- name: Open Pi-hole ports in ufw
  when: pihole_manage_ufw
  block:
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Allow DNS through ufw
      community.general.ufw:
        rule: allow
        port: "53"
        proto: "{{ item.1 }}"
        from_ip: "{{ item.0 }}"
        comment: pihole dns
      loop: "{{ pihole_ufw_allow_dns_from | product(['tcp', 'udp']) | list }}"
      loop_control:
        label: "{{ item.0 }} 53/{{ item.1 }}"

    - name: Allow the Pi-hole web UI through ufw
      community.general.ufw:
        rule: allow
        port: "{{ pihole_web_port | regex_search('[0-9]+') }}"
        proto: tcp
        from_ip: "{{ item }}"
        comment: pihole web
      loop: "{{ pihole_ufw_allow_web_from }}"
